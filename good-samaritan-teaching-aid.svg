<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The Good Samaritan story sequence</title>
  <desc id="desc">A colorful four-card teaching aid: a traveller is attacked, people pass by, the Samaritan helps, and the injured traveller is cared for.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#183c36" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#f4f8f2"/>
  <circle cx="70" cy="80" r="110" fill="#ffd166" opacity=".36"/>
  <circle cx="1135" cy="720" r="150" fill="#ff8a7a" opacity=".25"/>
  <rect x="34" y="28" width="1132" height="744" rx="28" fill="#ffffff" stroke="#d6e8df" stroke-width="4" filter="url(#shadow)"/>
  <rect x="34" y="28" width="1132" height="150" rx="28" fill="#174f49"/>
  <path d="M34 145 Q300 185 600 145 T1166 145 V178 H34 Z" fill="#20a39e"/>
  <text x="600" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#ffffff">The Good Samaritan</text>
  <text x="600" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#d9f4e8">Luke 10:25-37  |  Story sequence cards</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(66 214)">
      <rect width="252" height="438" rx="20" fill="#ff8a7a" stroke="#e66d62" stroke-width="3" filter="url(#shadow)"/>
      <circle cx="32" cy="34" r="24" fill="#ffffff"/><text x="32" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e66d62">1</text>
      <path d="M0 278 Q126 238 252 278 V438 H0 Z" fill="#f06f61" opacity=".7"/>
      <circle cx="126" cy="132" r="47" fill="#ffd7b5"/>
      <path d="M80 132 Q126 66 172 132 L168 148 Q126 120 84 148 Z" fill="#5b342c"/>
      <path d="M90 180 Q126 154 162 180 L177 270 L75 270 Z" fill="#174f49"/>
      <path d="M88 215 L50 260 M164 215 L202 260" stroke="#174f49" stroke-width="18" stroke-linecap="round"/>
      <path d="M64 286 Q126 260 188 286" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity=".8"/>
      <text x="126" y="326" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Hurt on the road</text>
      <text x="126" y="360" text-anchor="middle" font-size="17" fill="#fff7f2">A traveller is attacked</text>
      <text x="126" y="385" text-anchor="middle" font-size="17" fill="#fff7f2">and left beside the road.</text>
    </g>
    <g transform="translate(336 214)">
      <rect width="252" height="438" rx="20" fill="#71c7ed" stroke="#4ba9d5" stroke-width="3" filter="url(#shadow)"/>
      <circle cx="32" cy="34" r="24" fill="#ffffff"/><text x="32" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#3589b7">2</text>
      <circle cx="126" cy="112" r="84" fill="#b9ecff" opacity=".85"/>
      <circle cx="94" cy="125" r="31" fill="#ffd7b5"/><circle cx="158" cy="125" r="31" fill="#e9b18e"/>
      <path d="M66 158 L120 158 L130 260 L38 260 Z" fill="#ffffff"/><path d="M132 158 L184 158 L214 260 L118 260 Z" fill="#f6cf58"/>
      <path d="M50 277 L202 277" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity=".9"/>
      <path d="M76 292 L58 314 M176 292 L195 314" stroke="#3589b7" stroke-width="9" stroke-linecap="round"/>
      <text x="126" y="326" text-anchor="middle" font-size="22" font-weight="700" fill="#174f49">Some pass by</text>
      <text x="126" y="360" text-anchor="middle" font-size="17" fill="#174f49">The priest and Levite</text>
      <text x="126" y="385" text-anchor="middle" font-size="17" fill="#174f49">see him but continue on.</text>
    </g>
    <g transform="translate(606 214)">
      <rect width="252" height="438" rx="20" fill="#ffd166" stroke="#e6b83e" stroke-width="3" filter="url(#shadow)"/>
      <circle cx="32" cy="34" r="24" fill="#ffffff"/><text x="32" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#b07916">3</text>
      <circle cx="126" cy="116" r="48" fill="#8b5a3c"/>
      <path d="M80 175 Q126 140 172 175 L188 272 L64 272 Z" fill="#20a39e"/>
      <path d="M78 224 Q126 190 174 224" fill="none" stroke="#ffffff" stroke-width="16"/>
      <circle cx="82" cy="262" r="24" fill="#ffd7b5"/><circle cx="170" cy="262" r="24" fill="#e9b18e"/>
      <path d="M56 293 Q126 266 196 293" fill="none" stroke="#174f49" stroke-width="12" stroke-linecap="round"/>
      <text x="126" y="326" text-anchor="middle" font-size="22" font-weight="700" fill="#174f49">Mercy in action</text>
      <text x="126" y="360" text-anchor="middle" font-size="17" fill="#174f49">The Samaritan stops,</text>
      <text x="126" y="385" text-anchor="middle" font-size="17" fill="#174f49">helps, and shows care.</text>
    </g>
    <g transform="translate(876 214)">
      <rect width="252" height="438" rx="20" fill="#a8df8e" stroke="#78bd68" stroke-width="3" filter="url(#shadow)"/>
      <circle cx="32" cy="34" r="24" fill="#ffffff"/><text x="32" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#438d4b">4</text>
      <rect x="55" y="78" width="142" height="135" rx="12" fill="#ffffff" stroke="#438d4b" stroke-width="5"/>
      <path d="M55 116 H197 M55 155 H197" stroke="#a8df8e" stroke-width="5"/>
      <circle cx="98" cy="268" r="29" fill="#ffd7b5"/><circle cx="158" cy="268" r="29" fill="#e9b18e"/>
      <path d="M82 304 L114 304 L124 352 L68 352 Z M142 304 L174 304 L190 352 L134 352 Z" fill="#174f49"/>
      <path d="M96 275 Q126 298 158 275" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <text x="126" y="386" text-anchor="middle" font-size="22" font-weight="700" fill="#174f49">Go and do likewise</text>
      <text x="126" y="420" text-anchor="middle" font-size="17" fill="#174f49">Love your neighbour</text>
    </g>
  </g>
  <text x="600" y="718" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#174f49">Notice  |  Care  |  Help  |  Show mercy</text>
</svg>
