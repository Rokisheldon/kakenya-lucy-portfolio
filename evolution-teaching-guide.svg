<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of Man teaching guide</title>
  <desc id="desc">A textbook-style visual showing the study of fossil evidence, tool use, migration, adaptation and modern humans.</desc>
  <rect width="1000" height="700" rx="24" fill="#f8fafc"/>
  <rect x="30" y="30" width="940" height="640" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="4"/>
  <rect x="30" y="30" width="940" height="110" rx="18" fill="#312e81"/>
  <text x="500" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#ffffff" font-weight="700">How We Study Human Evolution</text>
  <text x="500" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#dbeafe">Evidence to Sequence to Interpretation to Explanation</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 188)">
      <rect width="160" height="330" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
      <rect x="20" y="25" width="120" height="100" rx="12" fill="#c7d2fe"/>
      <ellipse cx="80" cy="82" rx="42" ry="25" fill="#a16207" transform="rotate(-12 80 82)"/>
      <path d="M48 82 Q80 55 112 82 Q80 102 48 82Z" fill="#fef3c7"/>
      <text x="80" y="158" text-anchor="middle" font-size="20" fill="#312e81" font-weight="700">1. Evidence</text>
      <text x="80" y="190" text-anchor="middle" font-size="15" fill="#475569">Fossils</text>
      <text x="80" y="215" text-anchor="middle" font-size="15" fill="#475569">Artefacts</text>
      <text x="80" y="240" text-anchor="middle" font-size="15" fill="#475569">Genetics</text>
      <text x="80" y="265" text-anchor="middle" font-size="15" fill="#475569">Anatomy</text>
      <text x="80" y="308" text-anchor="middle" font-size="14" fill="#4f46e5" font-weight="700">What remains?</text>
    </g>
    <g transform="translate(260 188)">
      <rect width="160" height="330" rx="16" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="3"/>
      <rect x="20" y="25" width="120" height="100" rx="12" fill="#bae6fd"/>
      <circle cx="80" cy="66" r="28" fill="#8b5a3c"/>
      <path d="M50 95 Q80 78 110 95 L118 145 H42Z" fill="#312e81"/>
      <path d="M100 110 L140 82" stroke="#475569" stroke-width="11" stroke-linecap="round"/>
      <text x="80" y="158" text-anchor="middle" font-size="20" fill="#075985" font-weight="700">2. Sequence</text>
      <text x="80" y="190" text-anchor="middle" font-size="15" fill="#475569">Early ancestors</text>
      <text x="80" y="215" text-anchor="middle" font-size="15" fill="#475569">Tool use</text>
      <text x="80" y="240" text-anchor="middle" font-size="15" fill="#475569">Migration</text>
      <text x="80" y="265" text-anchor="middle" font-size="15" fill="#475569">Modern humans</text>
      <text x="80" y="308" text-anchor="middle" font-size="14" fill="#0284c7" font-weight="700">What came first?</text>
    </g>
    <g transform="translate(450 188)">
      <rect width="160" height="330" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
      <rect x="20" y="25" width="120" height="100" rx="12" fill="#d1fae5"/>
      <path d="M30 100 Q80 45 130 100" fill="none" stroke="#10b981" stroke-width="9"/>
      <circle cx="80" cy="70" r="10" fill="#065f46"/>
      <circle cx="45" cy="95" r="8" fill="#059669"/>
      <circle cx="116" cy="92" r="8" fill="#059669"/>
      <text x="80" y="158" text-anchor="middle" font-size="20" fill="#065f46" font-weight="700">3. Adapt</text>
      <text x="80" y="190" text-anchor="middle" font-size="15" fill="#475569">Food</text>
      <text x="80" y="215" text-anchor="middle" font-size="15" fill="#475569">Climate</text>
      <text x="80" y="240" text-anchor="middle" font-size="15" fill="#475569">Movement</text>
      <text x="80" y="265" text-anchor="middle" font-size="15" fill="#475569">Technology</text>
      <text x="80" y="308" text-anchor="middle" font-size="14" fill="#059669" font-weight="700">How did life change?</text>
    </g>
    <g transform="translate(640 188)">
      <rect width="160" height="330" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
      <rect x="20" y="25" width="120" height="100" rx="12" fill="#fed7aa"/>
      <circle cx="80" cy="65" r="32" fill="#8b5a3c"/>
      <path d="M48 98 Q80 82 112 98 L125 145 H35Z" fill="#312e81"/>
      <text x="80" y="158" text-anchor="middle" font-size="20" fill="#9a3412" font-weight="700">4. Explain</text>
      <text x="80" y="190" text-anchor="middle" font-size="15" fill="#475569">Claim</text>
      <text x="80" y="215" text-anchor="middle" font-size="15" fill="#475569">Evidence</text>
      <text x="80" y="240" text-anchor="middle" font-size="15" fill="#475569">Reasoning</text>
      <text x="80" y="265" text-anchor="middle" font-size="15" fill="#475569">Conclusion</text>
      <text x="80" y="308" text-anchor="middle" font-size="14" fill="#ea580c" font-weight="700">Why does it matter?</text>
    </g>
  </g>
  <rect x="830" y="188" width="100" height="330" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
  <text x="880" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155" font-weight="700">Think</text>
  <text x="880" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b" transform="rotate(-90 880 278)">Observe evidence</text>
  <text x="880" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b" transform="rotate(-90 880 430)">Explain change</text>
  <rect x="70" y="552" width="860" height="76" rx="12" fill="#312e81"/>
  <text x="500" y="598" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#ffffff">Observe carefully • Order accurately • Explain with evidence</text>
</svg>
